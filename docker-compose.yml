services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aihub
      POSTGRES_PASSWORD: aihub
      POSTGRES_DB: aihub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihub -d aihub"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aihub
      MINIO_ROOT_PASSWORD: aihub-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  aihub:
    build: .
    ports:
      - "8080:8080"
    environment:
      AIHUB_HTTP_ADDR: ":8080"
      AIHUB_PUBLIC_BASE_URL: "http://localhost:8080"
      AIHUB_DATABASE_URL: "postgres://aihub:aihub@postgres:5432/aihub?sslmode=disable"
      AIHUB_MINIO_ENDPOINT: "minio:9000"
      AIHUB_MINIO_ACCESS_KEY: "aihub"
      AIHUB_MINIO_SECRET_KEY: "aihub-secret"
      AIHUB_MINIO_USE_SSL: "false"
      AIHUB_MINIO_BUCKET: "aihub"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD_FILE: "/run/secrets/admin_password"
      AIHUB_SESSION_TTL: "24h"
      AIHUB_LOGIN_MAX_ATTEMPTS: "5"
      AIHUB_LOGIN_WINDOW: "5m"
      AIHUB_MAX_UPLOAD_MB: "100"
    secrets:
      - admin_password
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20

secrets:
  admin_password:
    file: ./admin_password.txt

volumes:
  pgdata:
  miniodata:
